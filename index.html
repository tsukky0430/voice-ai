<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03050d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Voice AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-state="idle">
  <canvas id="stars"></canvas>

  <header class="top">
    <div class="name" id="aiName">AI</div>
    <div class="status"><span class="dot"></span><span id="statusText">待機中</span></div>
    <div class="thread-title" id="threadTitle"></div>
    <button class="gear" id="settingsBtn" aria-label="設定">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="halo" id="halo"></div>
    <div class="orb-float" id="orbFloat">
      <img class="orb" id="orb" src="orb.webp" alt="" draggable="false" />
    </div>
    <div class="ring" id="ring"></div>
  </main>

  <section class="captions" id="captions">
    <p class="you" id="youText"></p>
    <div class="ai" id="aiText"></div>
  </section>

  <footer class="controls">
    <button class="side" id="handsfreeBtn" aria-pressed="false" title="ハンズフリー（会話を続ける）">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0v5a3 3 0 0 1-3 3h-1v-7h4M4 13h4v7H7a3 3 0 0 1-3-3v-4"/></svg>
      <span>ハンズフリー</span>
    </button>
    <button class="mic" id="micBtn" aria-label="話しかける">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="side" id="threadsBtn" title="会話の一覧">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 10h7M8.5 14h4.5"/></svg>
      <span>会話</span>
    </button>
  </footer>

  <form class="textbar" id="textForm" autocomplete="off">
    <input id="textInput" placeholder="文字で入力することもできます" enterkeyhint="send" />
    <button type="submit" aria-label="送信">
      <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <!-- 会話の一覧（切り替え・取り込み） -->
  <aside class="panel" id="threadsPanel" hidden>
    <div class="panel-head">
      <b id="threadsHeadTitle">会話</b>
      <button class="x" data-close aria-label="閉じる">×</button>
    </div>
    <div class="panel-body">
      <div class="view" id="threadsView">
        <div class="actions">
          <button class="primary" id="newThreadBtn">＋ 新しい会話</button>
          <button id="importFileBtn">claude.ai から取り込む</button>
          <button id="importPasteBtn">貼り付けて取り込む</button>
        </div>
        <input type="file" id="importFile" accept=".json,.zip,application/json,application/zip" hidden />
        <ul class="threads" id="threadList"></ul>
      </div>

      <div class="view" id="pickView" hidden>
        <p class="hint">続きを話したい会話を選んでください。選んだ会話だけがこの端末に保存されます。</p>
        <input id="pickSearch" class="field" placeholder="タイトルで絞り込む" />
        <ul class="threads" id="pickList"></ul>
        <div class="actions"><button id="pickBackBtn">戻る</button></div>
      </div>

      <div class="view" id="pasteView" hidden>
        <p class="hint">claude.ai の会話をコピーして貼り付けてください。AI がその内容を踏まえて続きを話します。</p>
        <input id="pasteTitle" class="field" placeholder="会話のタイトル（省略可）" />
        <textarea id="pasteText" class="field" rows="10" placeholder="ここに会話を貼り付け"></textarea>
        <div class="actions">
          <button class="primary" id="pasteSaveBtn">取り込んで続きを話す</button>
          <button id="pasteBackBtn">戻る</button>
        </div>
      </div>

      <div class="view" id="logView" hidden>
        <div class="log-body" id="logBody"></div>
        <div class="actions"><button id="logBackBtn">一覧に戻る</button></div>
      </div>
    </div>
  </aside>

  <!-- 設定 -->
  <aside class="panel" id="settingsPanel" hidden>
    <div class="panel-head">
      <b>設定</b>
      <button class="x" data-close aria-label="閉じる">×</button>
    </div>
    <div class="panel-body settings">
      <label class="row">
        <span>声の種類</span>
        <select id="voiceSel" class="field"></select>
      </label>
      <label class="row">
        <span>読み上げの速さ <output id="rateOut"></output></span>
        <input type="range" id="rateIn" min="0.6" max="1.8" step="0.05" />
        <span class="scale"><i>ゆっくり</i><i>はやい</i></span>
      </label>
      <label class="row">
        <span>声の高さ <output id="pitchOut"></output></span>
        <input type="range" id="pitchIn" min="0.5" max="1.6" step="0.05" />
        <span class="scale"><i>低い・落ち着いた</i><i>高い・明るい</i></span>
      </label>
      <div class="actions">
        <button class="primary" id="previewBtn">この声で試しに聞く</button>
        <button id="resetVoiceBtn">初期値に戻す</button>
      </div>
      <p class="hint">選べる声は端末によって変わります。iPhone では「設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 日本語」から高品質な声（Kyoko 拡張 など）を追加すると、ここで選べるようになります。</p>

      <label class="row">
        <span>合言葉</span>
        <input type="password" id="passIn" class="field" placeholder="APP_PASSCODE" autocomplete="off" />
      </label>
      <div class="actions"><button id="passSaveBtn">合言葉を保存</button></div>
    </div>
  </aside>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
